<!DOCTYPE html>
<html>
  <head>
    <title>MyProfile</title>
    <meta charset="UTF-8">
    <meta name="discription" content="自己紹介と自分の趣味を掲載するサイト">
    <meta name="viewport" content="width=device-width, initial=1.0">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- ヘッダー -->
     <header class="header">
      <h1 class="site-title">
        <a href="index.html">MyProfile</a>
      </h1>

       <!-- pc用ナビゲーション -->
        <nav id="nav-pc">
          <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#works">works</a></li>
          </ul>
        </nav>
     </header>
     <main>
      <article>
        <!-- メインビジュアル -->
        <div id="main-visual">
          <img src="images/main.png" alt="カメラの画像">
        </div> 

        <!-- About -->
         <section id="about">
         <h2 class="index-h2">About</h2>

         <div id="about-flex">
          <img id="about-photo" src="images/about.png" alt="男性の横顔">

          <div class="about-text">
            <h3>Kazuki Asahina</h3>
          <ul>
            <li>25歳 長野県佐久市出身</li>
            <li>ソフトウェア業界でマーケティングに従事</li>
            <li>趣味はカメラ、愛機はCanon</li>
            <li>自然を撮影するのが好きで、海や山によく行く</li>
          </ul>
          </div>
         </div>
         </section>

         <!-- Works -->
        <section id="works">
          <h2 class="index-h2">Works</h2>
          <div id="works-flex">
            <div>
            <img id="works1-photo" src="images/works1.png" alt="海の写真">
            <p>新潟に訪れた歳に、日本海の雄大さを魅了<br>されて撮影した1枚</p>
            </div>
            <div>
              <img id="works2-photo" src="images/works2.png" alt="山の写真">
              <P>地元長野の木曽町から撮影した、冠雪した<br>御嶽山</P>
            </div>
            <div>
              <img id="works3-photo" src="images/works3.png" alt="京都の町並み">
              <p>京都で撮影した、明け方の古き良き日本の<br>町並み</p>
            </div>
          </div>
        </section> 

        <!-- フッター -->
       <footer>
        <p id="copyright">&copy;MyProfile All rights reserved</p>
       </footer>
      </article>
     </main>
  </body>
</html>
